name: Container vulnerability scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '37 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-18.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: [alpine, full, ubuntu2204, ubuntu2404, ubuntu2604]
    steps:
      - uses: actions/checkout@v2
      - name: Build current image
        run: docker build --pull -f "Dockerfile.${{ matrix.target }}" -t "utils-audit:${{ matrix.target }}" .
      - name: Scan vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'utils-audit:${{ matrix.target }}'
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          severity: 'CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN'
          exit-code: '0'
      - name: Upload findings
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v1
        with:
          sarif_file: trivy-results.sarif
          category: 'container-${{ matrix.target }}'
